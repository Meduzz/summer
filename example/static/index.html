<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .error {
            background-color: #cce5ff;
            color: #004085;
        }
        #messages {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .message {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <h1>WebSocket Connection</h1>
    <div id="status">Status: Connecting...</div>
    <div id="messages"></div>

    <script src="static/websocket.js"></script>
</body>
</html>
